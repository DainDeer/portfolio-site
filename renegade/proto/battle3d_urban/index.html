<canvas id="view" aria-label="A 3D battle in the Hollis Outskirts: troops against scavengers."></canvas>

  <button id="btn-size" type="button" hidden>3v3</button>
  <button id="btn-fps" type="button" title="F: fps and timings">FPS</button>
  <button id="btn-sound" type="button">Sound: On</button>
